<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Repuestos Cuchau</title>
    <!-- Cargar Bootstrap local -->
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cargar estilos personalizados -->
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="custom-title text-center mb-4">Iniciar Sesión</h3>
                        
                        <div id="alerta-formulario"></div>

                        <form id="form-login" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="correoLogin" placeholder="ejemplo@duoc.cl" required>
                                <div class="invalid-feedback">Formato inválido. Solo dominios permitidos.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" placeholder="Tu contraseña" required>
                                <div class="invalid-feedback">Falta la contraseña.</div>
                            </div>

                            <button class="btn btn-custom-action w-100 mt-4 py-2" type="submit">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de Validaciones -->
    <script src="validaciones.js"></script>
</body>
</html>
